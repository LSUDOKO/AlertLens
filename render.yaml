# Render blueprint for the public API that the Cloudflare frontend calls. Free plan; it sleeps when idle.
services:
  - type: web
    name: alertlens-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: ALLOWED_ORIGINS
        value: https://alertlens.adoranto737.workers.dev
      - key: SENTRY_DSN
        sync: false
